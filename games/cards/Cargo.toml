[package]
name = "cards"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34", features=["persistence"] }
egui = { version = "0.34" }
egui_extras = { version = "0.34", features=["all_loaders"] }
kudchuet = { path = "../../kudchuet" }
fastrand = "2.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[lints]
workspace = true

[lib]
name = "cards"

[[bin]]
name = "cards"
path = "src/main.rs"