[package]
name = "chinese_checkers"
version = "0.1.0"
edition = "2024"

[dependencies]
kudchuet = { path = "../../kudchuet" }
bitboard = {path="../../bitboards/bitboard"}
bitboard_proc_macro = {path="../../bitboards/bitboard_proc_macro"}
#bitboard = {git = "https://github.com/ultrasuperpingu/bitboards.git"}
#bitboard_proc_macro = {git = "https://github.com/ultrasuperpingu/bitboards.git"}
#egui_field_editor = {git = "https://github.com/ultrasuperpingu/egui_field_editor.git", features=["filepicker"] }
#egui_field_editor = {path="../../../egui_inspect/egui_field_editor", features=["filepicker"] }
egui_field_editor = "0.6"


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[lints]
workspace = true


[lib]
name = "chinese_checkers"

[[bin]]
name = "chinese_checkers"
path = "src/main.rs"