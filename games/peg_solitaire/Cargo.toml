[package]
name = "peg_solitaire"
version = "0.1.0"
edition = "2024"

[dependencies]
kudchuet = { path = "../../kudchuet" }
bitboard = {path="../../bitboards/bitboard"}
bitboard_proc_macro = {path="../../bitboards/bitboard_proc_macro"}
#bitboard = {git = "https://github.com/ultrasuperpingu/bitboards.git"}
#bitboard_proc_macro = {git = "https://github.com/ultrasuperpingu/bitboards.git"}
fastrand = "2.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[lints]
workspace = true

[lib]
name = "peg_solitaire"

[[bin]]
name = "peg_solitaire"
path = "src/main.rs"