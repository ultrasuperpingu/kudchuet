[package]
name = "klondike"
version = "0.1.0"
edition = "2024"

[dependencies]
kudchuet = { path = "../../kudchuet" }
fastrand = "2.4"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[lints]
workspace = true

[lib]
name = "klondike"

[[bin]]
name = "klondike"
path = "src/main.rs"