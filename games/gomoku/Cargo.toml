[package]
name = "gomoku"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34", features=["persistence"] }
kudchuet = { path = "../../kudchuet" }
bitboard = {path="../../bitboards/bitboard"}
bitboard_proc_macro = {path="../../bitboards/bitboard_proc_macro"}
#bitboard = {git = "https://github.com/ultrasuperpingu/bitboards.git"}
#bitboard_proc_macro = {git = "https://github.com/ultrasuperpingu/bitboards.git"}
fastrand = "2.4"
regex = "1.12"

[dev-dependencies]
bencher = "0.1"


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[[bench]]
name = "game_tree"
harness = false

[lib]
name = "gomoku"

[[bin]]
name = "gomoku"
path = "src/main.rs"